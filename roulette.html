<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="이름, 메뉴, 벌칙을 입력하고 돌리는 무료 랜덤 룰렛 돌림판">
  <title>무료 랜덤 룰렛 · 돌림판</title>
  <style>
    :root{--bg:#071120;--panel:#111f34;--line:#29425f;--text:#f1f7ff;--muted:#9eb1c9;--blue:#4c9cff;--pink:#ff5d9e;--green:#36d6a1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#233f74 0,#071120 48%);color:var(--text);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:26px 0 55px}.hero{text-align:center;margin-bottom:18px}.hero h1{margin:0 0 7px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;color:var(--muted)}
    .layout{display:grid;grid-template-columns:minmax(330px,1fr) 360px;gap:18px}.card{background:rgba(17,31,52,.95);border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:0 20px 55px rgba(0,0,0,.25)}.wheel-box{display:grid;place-items:center;position:relative;min-height:570px}.pointer{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:42px solid #fff;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45));z-index:3}canvas{width:min(100%,540px);height:auto;filter:drop-shadow(0 16px 25px rgba(0,0,0,.35))}.spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:104px;height:104px;border-radius:50%;border:7px solid #fff;background:linear-gradient(135deg,var(--pink),#775cff);color:white;font-weight:900;font-size:21px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.38);z-index:2}.spin:disabled{filter:grayscale(.6);cursor:not-allowed}.spin:hover:not(:disabled){filter:brightness(1.12)}
    h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:13px;color:#c6d7eb;font-weight:700;margin:13px 0 7px}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;background:#091729;border:1px solid #314c6b;color:var(--text);border-radius:12px;padding:11px 12px;outline:none}textarea{resize:vertical;min-height:190px;line-height:1.55}textarea:focus,input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(76,156,255,.14)}.hint{font-size:12px;color:var(--muted);line-height:1.55;margin:7px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin:12px 0}.check input{width:auto;accent-color:var(--blue)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 12px;color:#eaf4ff;background:#243b59;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--blue),#745cff)}.btn:hover{filter:brightness(1.1)}
    .history{margin-top:17px;padding-top:16px;border-top:1px solid var(--line)}.history-head{display:flex;justify-content:space-between;align-items:center}.history-head button{border:0;background:transparent;color:var(--muted);cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;max-height:130px;overflow:auto}.chip{background:#192d47;border:1px solid #324d6d;border-radius:99px;padding:7px 10px;font-size:12px}.empty{color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;background:rgba(2,8,17,.8);display:none;place-items:center;padding:20px;z-index:10}.modal.show{display:grid}.winner{width:min(440px,100%);background:linear-gradient(145deg,#152b49,#0c192a);border:1px solid #496786;border-radius:24px;padding:28px;text-align:center;box-shadow:0 30px 90px #000}.winner small{color:var(--muted)}.winner strong{display:block;font-size:clamp(32px,8vw,54px);color:#ffd166;margin:15px 0;word-break:break-word}.winner .buttons{grid-template-columns:1fr 1fr}.confetti{position:fixed;width:10px;height:16px;top:-25px;z-index:12;pointer-events:none;animation:fall 2.3s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(900deg);opacity:.8}}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.wheel-box{min-height:auto;padding:30px 6px}.pointer{top:7px}.spin{width:90px;height:90px;font-size:18px}.settings{order:-1}}@media(max-width:450px){.wrap{width:calc(100% - 14px);padding-top:18px}.card{padding:14px;border-radius:16px}.two{grid-template-columns:1fr}.winner .buttons{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap"><header class="hero"><h1>🎯 무료 랜덤 룰렛</h1><p>메뉴·이름·벌칙을 한 줄에 하나씩 입력하고 돌려보세요.</p></header>
  <section class="layout">
    <div class="card wheel-box"><div class="pointer"></div><canvas id="wheel" width="800" height="800"></canvas><button class="spin" id="spin">돌리기</button></div>
    <aside class="card settings"><h2>룰렛 항목</h2><textarea id="items">치킨
피자
삼겹살
짜장면
초밥
떡볶이</textarea><p class="hint">한 줄에 하나씩 입력하세요. 2개부터 30개까지 사용할 수 있습니다.</p>
      <div class="two"><div><label for="duration">회전 시간</label><select id="duration"><option value="3">3초</option><option value="5" selected>5초</option><option value="8">8초</option></select></div><div><label for="title">룰렛 제목</label><input id="title" value="오늘 뭐 먹지?"></div></div>
      <label class="check"><input type="checkbox" id="remove"> 당첨 항목을 다음 룰렛에서 자동 제외</label><label class="check"><input type="checkbox" id="sound" checked> 효과음 사용</label>
      <div class="buttons"><button class="btn primary" id="apply">항목 적용</button><button class="btn" id="shuffle">순서 섞기</button></div>
      <div class="history"><div class="history-head"><h2>당첨 기록</h2><button id="clear">기록 삭제</button></div><div class="chips" id="history"><span class="empty">아직 당첨 기록이 없습니다.</span></div></div>
    </aside>
  </section>
</main>
<div class="modal" id="modal"><div class="winner"><small id="modalTitle">당첨 결과</small><strong id="winnerText"></strong><div class="buttons"><button class="btn primary" id="again">다시 돌리기</button><button class="btn" id="close">닫기</button></div></div></div>
<script>
const $=id=>document.getElementById(id),canvas=$('wheel'),ctx=canvas.getContext('2d');
const palette=['#ff5d8f','#ff9258','#ffd166','#30c9a2','#2fb9e8','#5c83f1','#885cf6','#d35be2','#f05cad','#26a69a'];let values=[],rotation=0,spinning=false,history=[];
function parse(){return $('items').value.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,30)}
function draw(){values=parse();if(values.length<2){ctx.clearRect(0,0,800,800);return}const cx=400,cy=400,r=365,arc=Math.PI*2/values.length;ctx.clearRect(0,0,800,800);ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);
 values.forEach((v,i)=>{const a=i*arc-Math.PI/2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a,a+arc);ctx.closePath();ctx.fillStyle=palette[i%palette.length];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.rotate(a+arc/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=5;ctx.font=`800 ${values.length>16?22:values.length>10?27:34}px "Malgun Gothic"`;const text=v.length>12?v.slice(0,11)+'…':v;ctx.fillText(text,r-25,0);ctx.restore()});ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=9;ctx.stroke();ctx.restore()}
function beep(freq=650,d=.035){if(!$('sound').checked)return;try{const ac=beep.ac||(beep.ac=new (AudioContext||webkitAudioContext)()),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function spin(){values=parse();if(spinning)return;if(values.length<2){alert('항목을 두 개 이상 입력해주세요.');return}spinning=true;$('spin').disabled=true;const dur=+$('duration').value*1000,start=performance.now(),from=rotation,extra=(6+Math.random()*5)*Math.PI*2+Math.random()*Math.PI*2;let last=-1;
 function frame(now){const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,4);rotation=from+extra*e;const tick=Math.floor(rotation/(Math.PI*2/values.length));if(tick!==last){beep(500,.025);last=tick}draw();if(t<1)requestAnimationFrame(frame);else finish()}requestAnimationFrame(frame)}
function finish(){rotation%=Math.PI*2;const arc=Math.PI*2/values.length,index=((Math.round((-rotation)/arc)%values.length)+values.length)%values.length,winner=values[index];spinning=false;$('spin').disabled=false;history.unshift(winner);history=history.slice(0,30);renderHistory();$('modalTitle').textContent=$('title').value.trim()||'당첨 결과';$('winnerText').textContent=winner;$('modal').classList.add('show');beep(880,.25);confetti();if($('remove').checked){values.splice(index,1);$('items').value=values.join('\n');draw()}}
function renderHistory(){$('history').innerHTML=history.length?history.map((x,i)=>`<span class="chip">${history.length-i}회 · ${escapeHtml(x)}</span>`).join(''):'<span class="empty">아직 당첨 기록이 없습니다.</span>'}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function confetti(){for(let i=0;i<60;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=palette[i%palette.length];e.style.setProperty('--x',(Math.random()*220-110)+'px');e.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
$('spin').onclick=spin;$('apply').onclick=()=>{if(parse().length<2)return alert('항목을 두 개 이상 입력해주세요.');rotation=0;draw()};$('shuffle').onclick=()=>{const a=parse();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}$('items').value=a.join('\n');draw()};$('clear').onclick=()=>{history=[];renderHistory()};$('close').onclick=()=>$('modal').classList.remove('show');$('again').onclick=()=>{$('modal').classList.remove('show');setTimeout(spin,180)};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};window.addEventListener('resize',draw);draw();
</script></body></html>
