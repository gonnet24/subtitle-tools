<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="생년월일로 만 나이와 살아온 날짜를 계산하는 무료 도구"><title>만 나이 계산기 | 자막공간</title><style>:root{--b:#071426;--p:#10233d;--l:#294764;--t:#f4f8ff;--m:#9db1c8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1c416f,var(--b) 55%);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(720px,calc(100% - 20px));margin:auto;padding:18px 0 45px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#cfe2ff;text-decoration:none;font-weight:800}.card{background:#10233df2;border:1px solid var(--l);border-radius:20px;padding:20px;margin-top:15px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;background:#08182b;border:1px solid #365875;border-radius:12px;padding:12px;color:white}button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:13px;background:linear-gradient(135deg,#4f9fff,#755fff);color:#fff;font-weight:900;font-size:16px}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.result{background:#091a2e;border:1px solid #294764;border-radius:14px;padding:16px}.result small{color:var(--m)}.result b{display:block;font-size:25px;margin-top:5px;color:#ffd166}.wide{grid-column:1/-1}.note{color:var(--m);font-size:12px;line-height:1.6}@media(max-width:550px){.inputs,.results{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:15px}}</style></head><body><main class="wrap"><header class="top"><a href="index.html">← 도구 모음</a><h1>🎂 만 나이 계산기</h1><span></span></header><section class="card"><div class="inputs"><div><label>생년월일</label><input id="birth" type="date"></div><div><label>기준일</label><input id="base" type="date"></div></div><button id="calc">나이 계산하기</button><div class="results" id="results"></div><p class="note">만 나이는 기준일에 생일이 지났는지에 따라 계산합니다. 태어난 날은 살아온 날짜에 포함됩니다.</p></section></main><script>const $=x=>document.getElementById(x),local=d=>{let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};$('base').value=local(new Date());let d=new Date();d.setFullYear(d.getFullYear()-30);$('birth').value=local(d);function calc(){let b=new Date($('birth').value+'T00:00:00'),n=new Date($('base').value+'T00:00:00');if(isNaN(b)||isNaN(n)||b>n)return alert('생년월일과 기준일을 정확히 입력해주세요.');let age=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))age--;let days=Math.floor((n-b)/86400000)+1,korean=n.getFullYear()-b.getFullYear()+1,next=new Date(n.getFullYear(),b.getMonth(),b.getDate());if(next<n)next.setFullYear(next.getFullYear()+1);let left=Math.ceil((next-n)/86400000);$('results').innerHTML=`<div class="result"><small>현재 만 나이</small><b>만 ${age}세</b></div><div class="result"><small>연 나이</small><b>${n.getFullYear()-b.getFullYear()}세</b></div><div class="result"><small>세는 나이(참고)</small><b>${korean}세</b></div><div class="result"><small>다음 생일까지</small><b>D-${left}</b></div><div class="result wide"><small>태어난 날부터 살아온 기간</small><b>${days.toLocaleString()}일</b></div>`} $('calc').onclick=calc;calc();</script></body></html>
