<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="설치 없이 사용하는 무료 타이머와 스톱워치"><title>타이머·스톱워치 | 자막공간</title><style>:root{--b:#071426;--p:#10233d;--l:#294764;--t:#f4f8ff;--m:#9db1c8;--a:#559eff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1d416f,var(--b) 55%);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(680px,calc(100% - 20px));margin:auto;padding:18px 0 45px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#cfe2ff;text-decoration:none;font-weight:800}.card{background:#10233df2;border:1px solid var(--l);border-radius:20px;padding:18px;margin-top:15px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#08182b;border-radius:13px;padding:5px}.tab{border:0;background:transparent;color:#9fb2c8;padding:11px;border-radius:10px;font-weight:900}.tab.on{background:#294d78;color:white}.clock{text-align:center;font:900 clamp(48px,14vw,86px)/1 monospace;margin:35px 0 25px;letter-spacing:-4px}.inputs{display:flex;justify-content:center;align-items:center;gap:8px}.inputs input{width:85px;background:#08182b;border:1px solid #365875;border-radius:12px;padding:11px;color:white;text-align:center;font-size:18px}.buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 18px;background:#29425f;color:#fff;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#4f9fff,#755fff)}.laps{margin-top:15px;max-height:210px;overflow:auto}.lap{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid #294764;color:#c9d7e7}.hide{display:none}.hint{text-align:center;color:var(--m);font-size:12px;margin-top:15px}@media(max-width:450px){.card{padding:13px}.clock{letter-spacing:-3px}}</style></head><body><main class="wrap"><header class="top"><a href="index.html">← 도구 모음</a><h1>⏱️ 타이머·스톱워치</h1><span></span></header><section class="card"><div class="tabs"><button class="tab on" data-mode="timer">타이머</button><button class="tab" data-mode="stopwatch">스톱워치</button></div><div id="timerBox"><div class="inputs"><input id="min" type="number" min="0" max="999" value="5" aria-label="분"><b>분</b><input id="sec" type="number" min="0" max="59" value="0" aria-label="초"><b>초</b></div></div><div class="clock" id="clock">05:00</div><div class="buttons"><button class="primary" id="start">시작</button><button id="lap">구간 기록</button><button id="reset">초기화</button></div><div class="laps" id="laps"></div><p class="hint">타이머가 끝나면 알림음이 울립니다. 화면을 켜둔 상태에서 사용하세요.</p></section></main><script>const $=x=>document.getElementById(x);let mode='timer',running=false,raf=0,end=0,elapsed=0,started=0,laps=[];function fmt(ms,centi=false){ms=Math.max(0,ms);let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+(centi?'.'+String(Math.floor(ms%1000/10)).padStart(2,'0'):'')}function draw(t){if(!running)return;if(mode==='timer'){let left=end-Date.now();$('clock').textContent=fmt(left);if(left<=0){stop();$('clock').textContent='00:00';beep();alert('타이머가 끝났어요!');return}}else{$('clock').textContent=fmt(elapsed+performance.now()-started,true)}raf=requestAnimationFrame(draw)}function stop(){running=false;cancelAnimationFrame(raf);$('start').textContent='시작'}function beep(){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.7)}catch{}}function start(){if(running){if(mode==='stopwatch')elapsed+=performance.now()-started;stop();return}if(mode==='timer'){let total=(+$('min').value*60 + +$('sec').value)*1000;if(!total)return alert('시간을 입력해주세요.');end=Date.now()+total}else started=performance.now();running=true;$('start').textContent='일시정지';raf=requestAnimationFrame(draw)}function reset(){stop();elapsed=0;laps=[];$('laps').innerHTML='';$('clock').textContent=mode==='timer'?fmt((+$('min').value*60 + +$('sec').value)*1000):'00:00.00'}$('start').onclick=start;$('reset').onclick=reset;$('lap').onclick=()=>{if(mode!=='stopwatch'||!running)return;laps.unshift(fmt(elapsed+performance.now()-started,true));$('laps').innerHTML=laps.map((x,i)=>`<div class="lap"><span>${laps.length-i}구간</span><b>${x}</b></div>`).join('')};['min','sec'].forEach(x=>$(x).oninput=()=>{if(!running&&mode==='timer')reset()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{stop();mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));$('timerBox').classList.toggle('hide',mode!=='timer');$('lap').classList.toggle('hide',mode!=='stopwatch');reset()});$('lap').classList.add('hide');reset();document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='stopwatch'&&running)elapsed+=performance.now()-started;if(!document.hidden&&mode==='stopwatch'&&running)started=performance.now()});</script></body></html>
