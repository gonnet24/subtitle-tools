<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>자막공방 - SMI SRT 변환기</title><style>body{font-family:system-ui;margin:0;background:#f5f6fa;color:#171717}header{background:#111827;color:white;padding:22px}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:white;padding:22px;border-radius:16px;margin:18px 0;border:1px solid #ddd}textarea{width:100%;height:300px;box-sizing:border-box;padding:12px}button,select,input{padding:10px;margin:5px;border-radius:8px;border:1px solid #ccc}button{background:#2563eb;color:white;font-weight:bold}.ad{padding:30px;text-align:center;border:1px dashed #bbb;color:#888;margin:20px 0}</style></head><body><header><div class="wrap"><h1>자막공방</h1><p>SMI · SRT 자막을 브라우저에서 변환합니다.</p></div></header><main class="wrap"><div class="card"><div class="ad">AdSense 승인 후 광고 영역</div><input id="f" type="file" accept=".smi,.srt"><select id="from"><option>SMI</option><option>SRT</option></select><select id="to"><option>SRT</option><option>SMI</option></select><label> 싱크(초) <input id="shift" type="number" step=".1" value="0"></label><textarea id="t" placeholder="자막 파일을 선택하거나 내용을 붙여넣으세요"></textarea><button id="go">변환</button><button id="down" disabled>다운로드</button><p id="msg"></p></div><div class="card"><h2>사용방법</h2><p>파일을 선택하고 변환 형식을 고른 뒤 변환 버튼을 누르세요. 파일 내용은 서버에 업로드하지 않고 브라우저 안에서 처리합니다.</p></div><div class="card"><h2>개인정보처리방침</h2><p>선택한 자막 파일은 서버에 전송하거나 저장하지 않습니다. 광고 적용 시 관련 쿠키 및 광고 서비스 고지를 추가합니다.</p></div></main><script>
let out='',ext='srt';const $=x=>document.getElementById(x),pad=(n,w=2)=>String(n).padStart(w,'0');
function tm(ms){ms=Math.max(0,ms);let h=Math.floor(ms/3600000);ms%=3600000;let m=Math.floor(ms/60000);ms%=60000;return `${pad(h)}:${pad(m)}:${pad(Math.floor(ms/1000))},${pad(ms%1000,3)}`}
function smi(t){let r=/<sync[^>]*start\s*=\s*["']?(\d+)["']?[^>]*>([\s\S]*?)(?=<sync|<\/body>|<\/sami>|$)/ig,m,a=[];while(m=r.exec(t)){let x=m[2].replace(/<br\s*\/?>/ig,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/ig,' ').trim();if(x)a.push({a:+m[1],x})}return a.map((v,i)=>({a:v.a,b:a[i+1]?.a??v.a+3000,x:v.x}))}
function srt(t){return t.replace(/\r/g,'').trim().split(/\n\s*\n/).map(b=>{let l=b.split('\n'),i=l.findIndex(x=>x.includes('-->'));if(i<0)return null,q=l[i].match(/(\d+):(\d+):(\d+),(\d+)\s*-->\s*(\d+):(\d+):(\d+),(\d+)/);if(!q)return null;let M=(a,b,c,d)=>(+a*3600+ +b*60+ +c)*1000+ +d;return{a:M(q[1],q[2],q[3],q[4]),b:M(q[5],q[6],q[7],q[8]),x:l.slice(i+1).join('\n')}}).filter(Boolean)}
$('f').onchange=e=>{let f=e.target.files[0];if(!f)return;$('from').value=f.name.toLowerCase().endsWith('.smi')?'SMI':'SRT';let r=new FileReader;r.onload=()=>$('t').value=r.result;r.readAsText(f,'UTF-8')};
$('go').onclick=()=>{let a=$('from').value==='SMI'?smi($('t').value):srt($('t').value),sh=(+$('shift').value||0)*1000;a=a.map(v=>({...v,a:Math.max(0,v.a+sh),b:Math.max(0,v.b+sh)}));if(!a.length){$('msg').textContent='자막을 읽지 못했습니다.';return}if($('to').value==='SRT'){out=a.map((v,i)=>`${i+1}\n${tm(v.a)} --> ${tm(v.b)}\n${v.x}`).join('\n\n');ext='srt'}else{out='<SAMI>\n<BODY>\n'+a.map(v=>`<SYNC Start=${v.a}><P Class=KRCC>${v.x.replace(/\n/g,'<br>')}`).join('\n')+'\n</BODY>\n</SAMI>';ext='smi'}$('t').value=out;$('down').disabled=false;$('msg').textContent=a.length+'개 자막 변환 완료'};
$('down').onclick=()=>{let u=URL.createObjectURL(new Blob([out],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='converted.'+ext;a.click();URL.revokeObjectURL(u)};
</script></body></html>
