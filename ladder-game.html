<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="이름과 결과를 입력해 사용하는 무료 사다리 타기"><title>사다리 타기 | 자막공간</title><style>:root{--b:#071426;--p:#10233d;--l:#294764;--t:#f4f8ff;--m:#9db1c8;--a:#559eff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1d416f,var(--b) 55%);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(920px,calc(100% - 20px));margin:auto;padding:18px 0 45px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#cfe2ff;text-decoration:none;font-weight:800}.card{background:#10233df2;border:1px solid var(--l);border-radius:20px;padding:18px;margin-top:15px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:800;margin-bottom:7px}textarea{width:100%;min-height:150px;border:1px solid #365875;border-radius:13px;background:#08182b;color:white;padding:12px;font:15px/1.6 inherit;resize:vertical}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}button{border:0;border-radius:12px;padding:12px 17px;background:#263e5d;color:#fff;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#4d9dff,#755eff)}canvas{display:block;width:100%;height:auto;background:#07182a;border-radius:15px;margin-top:15px}.hint{color:var(--m);font-size:13px;line-height:1.6}.result{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.item{padding:11px;background:#091a2e;border-radius:10px}.item b{color:#ffd166}@media(max-width:650px){.inputs,.result{grid-template-columns:1fr}.card{padding:13px}}</style></head><body><main class="wrap"><header class="top"><a href="index.html">← 도구 모음</a><h1>🪜 사다리 타기</h1><span></span></header><section class="card"><div class="inputs"><div><label>참가자 (한 줄에 한 명)</label><textarea id="names">민수
영희
철수
지은</textarea></div><div><label>결과 (한 줄에 하나)</label><textarea id="prizes">당첨
커피 사기
청소하기
꽝</textarea></div></div><div class="buttons"><button class="primary" id="make">사다리 만들기</button><button id="reveal">결과 공개</button><button id="reset">초기화</button></div><p class="hint">참가자와 결과 수를 같게 입력하세요. 2명부터 10명까지 사용할 수 있습니다.</p><canvas id="ladder" width="900" height="540"></canvas><div class="result" id="result"></div></section></main><script>const $=x=>document.getElementById(x),cv=$('ladder'),ctx=cv.getContext('2d');let names=[],prizes=[],links=[],map=[];function lines(id){return $(id).value.split(/\n/).map(x=>x.trim()).filter(Boolean)}function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function build(){names=lines('names');prizes=lines('prizes');if(names.length<2||names.length>10||names.length!==prizes.length)return alert('참가자와 결과를 2~10개로 같은 수만큼 입력해주세요.');let n=names.length,rows=Math.max(7,n*2);links=Array.from({length:rows},()=>Array(n-1).fill(false));for(let r=0;r<rows;r++){for(let c=0;c<n-1;c++)if(Math.random()<.43&&!links[r][c-1])links[r][c]=true}map=[];for(let s=0;s<n;s++){let c=s;for(let r=0;r<rows;r++){if(c<n-1&&links[r][c])c++;else if(c>0&&links[r][c-1])c--}map[s]=c}draw();$('result').innerHTML=''}function draw(){let n=names.length;if(!n){ctx.clearRect(0,0,cv.width,cv.height);return}let pad=70,top=70,bottom=460,dx=(cv.width-pad*2)/(n-1||1),dy=(bottom-top)/(links.length-1);ctx.clearRect(0,0,cv.width,cv.height);ctx.font='bold 18px sans-serif';ctx.textAlign='center';for(let c=0;c<n;c++){let x=pad+c*dx;ctx.fillStyle='#f4f8ff';ctx.fillText(names[c],x,35);ctx.strokeStyle='#6588ad';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();ctx.fillStyle='#ffd166';ctx.fillText(prizes[c],x,510)}ctx.strokeStyle='#53d0a3';ctx.lineWidth=6;for(let r=0;r<links.length;r++)for(let c=0;c<n-1;c++)if(links[r][c]){ctx.beginPath();ctx.moveTo(pad+c*dx,top+r*dy);ctx.lineTo(pad+(c+1)*dx,top+r*dy);ctx.stroke()}}$('make').onclick=build;$('reveal').onclick=()=>{if(!map.length)return build();$('result').innerHTML=names.map((n,i)=>`<div class="item">${n} → <b>${prizes[map[i]]}</b></div>`).join('')};$('reset').onclick=()=>{$('result').innerHTML='';build()};build();</script></body></html>
