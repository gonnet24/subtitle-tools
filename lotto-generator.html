<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="고정 번호와 제외 번호를 지정할 수 있는 무료 로또 번호 생성기"><title>로또 번호 생성기 | 자막공간</title><style>:root{--b:#081527;--p:#11253e;--l:#2c4966;--t:#f4f8ff;--m:#9fb2c8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#244a77,var(--b) 55%);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(760px,calc(100% - 20px));margin:auto;padding:18px 0 45px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#cfe2ff;text-decoration:none;font-weight:800}.card{background:#11253ef2;border:1px solid var(--l);border-radius:20px;padding:19px;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr 140px;gap:10px}label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}input,select{width:100%;border:1px solid #3a5b79;background:#08182b;color:white;border-radius:12px;padding:12px}.hint{color:var(--m);font-size:12px;line-height:1.6}.buttons{display:flex;gap:9px;margin:15px 0}button{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(135deg,#4f9fff,#755fff);color:#fff;font-weight:900;cursor:pointer}.secondary{background:#29425f}.sets{display:grid;gap:10px}.set{display:flex;align-items:center;gap:9px;padding:13px;background:#091a2e;border-radius:14px}.num{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#162033;background:#ffd166}.num:nth-child(3n){background:#63d7a9}.num:nth-child(3n+1){background:#66adff}.num:nth-child(3n+2){background:#ff7fa2}.set small{color:var(--m);margin-left:auto}@media(max-width:630px){.grid{grid-template-columns:1fr}.card{padding:14px}.set{gap:5px}.num{width:36px;height:36px}}</style></head><body><main class="wrap"><header class="top"><a href="index.html">← 도구 모음</a><h1>🍀 로또 번호 생성기</h1><span></span></header><section class="card"><div class="grid"><div><label>고정 번호</label><input id="fixed" placeholder="예: 3, 12"></div><div><label>제외 번호</label><input id="exclude" placeholder="예: 7, 21, 40"></div><div><label>게임 수</label><select id="count"><option>1</option><option>3</option><option selected>5</option></select></div></div><p class="hint">번호는 쉼표나 공백으로 구분하세요. 고정 번호는 최대 5개까지 가능합니다. 번호는 재미로만 이용해 주세요.</p><div class="buttons"><button id="generate">번호 생성</button><button class="secondary" id="clear">초기화</button></div><div class="sets" id="sets"></div></section></main><script>const $=x=>document.getElementById(x);function nums(v){return[...new Set(v.split(/[\s,]+/).map(Number).filter(n=>n>=1&&n<=45))]}function make(){let f=nums($('fixed').value),e=nums($('exclude').value);if(f.length>5)return alert('고정 번호는 최대 5개까지 선택할 수 있어요.');if(f.some(n=>e.includes(n)))return alert('고정 번호와 제외 번호가 겹쳐요.');let out=[];for(let k=0;k<+$('count').value;k++){let pool=[];for(let n=1;n<=45;n++)if(!f.includes(n)&&!e.includes(n))pool.push(n);if(pool.length<6-f.length)return alert('사용 가능한 번호가 부족해요.');for(let i=pool.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}out.push([...f,...pool.slice(0,6-f.length)].sort((a,b)=>a-b))}$('sets').innerHTML=out.map((s,i)=>`<div class="set">${s.map(n=>`<span class="num">${n}</span>`).join('')}<small>${i+1}게임</small></div>`).join('')}$('generate').onclick=make;$('clear').onclick=()=>{$('fixed').value='';$('exclude').value='';$('sets').innerHTML=''};make();</script></body></html>
