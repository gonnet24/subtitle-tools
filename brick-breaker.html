<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="description" content="설치 없이 즐기는 무료 벽돌 깨기 웹게임">
  <title>벽돌 깨기 | 자막공간 무료게임</title>
  <style>
    :root{--bg:#071426;--panel:#10233d;--line:#294764;--text:#f3f8ff;--muted:#9db1c8;--blue:#54a4ff;--pink:#ff5f93;--yellow:#ffd166}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#1a3c69,#071426 55%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(760px,calc(100% - 18px));margin:auto;padding:18px 0 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.top a{color:#cfe2ff;text-decoration:none;font-weight:800}.top h1{font-size:clamp(22px,5vw,34px);margin:0}.panel{background:rgba(16,35,61,.95);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 22px 60px #0006}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#0a1a30;border:1px solid #284764;border-radius:12px;padding:9px;text-align:center}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:3px;font-size:17px;color:#fff}.gamebox{position:relative;border-radius:15px;overflow:hidden;background:#030a14;touch-action:pan-y}canvas{display:block;width:100%;height:auto}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#04101dcc;padding:22px}.overlay.hide{display:none}.overlay h2{font-size:clamp(27px,7vw,44px);margin:0 0 8px}.overlay p{color:#c3d3e7;line-height:1.6;margin:0 0 18px}.btn{border:0;border-radius:13px;padding:13px 22px;background:linear-gradient(135deg,#4898ff,#7b61ff);color:white;font-weight:900;font-size:17px;cursor:pointer}.help{text-align:center;color:var(--muted);font-size:13px;line-height:1.65;margin:12px 3px 0}.mobile{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.move{border:1px solid #355879;background:#162d4b;color:white;border-radius:13px;padding:14px;font-size:22px;font-weight:900;touch-action:manipulation}@media(max-width:650px){.wrap{padding-top:10px}.panel{padding:9px;border-radius:15px}.stats{gap:5px}.stat{padding:7px 3px}.mobile{display:grid}.help .desktop{display:none}}@media(max-width:390px){.stat b{font-size:14px}.stat small{font-size:10px}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top"><a href="index.html">← 도구 모음</a><h1>🧱 벽돌 깨기</h1><span></span></header>
  <section class="panel">
    <div class="stats"><div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>최고점수</small><b id="best">0</b></div><div class="stat"><small>목숨</small><b id="lives">3</b></div><div class="stat"><small>단계</small><b id="level">1</b></div></div>
    <div class="gamebox" id="gamebox"><canvas id="game" width="720" height="760" aria-label="벽돌 깨기 게임"></canvas><div class="overlay" id="overlay"><div><h2 id="message">벽돌 깨기</h2><p id="sub">공을 튕겨 모든 벽돌을 깨보세요.<br>화면을 누르거나 버튼을 눌러 시작합니다.</p><button class="btn" id="start">게임 시작</button></div></div></div>
    <div class="mobile"><button class="move" id="left" aria-label="왼쪽 이동">◀</button><button class="move" id="right" aria-label="오른쪽 이동">▶</button></div>
    <p class="help"><span class="desktop">PC: ← → 방향키 또는 마우스를 누른 채 이동 · 스페이스바로 시작/일시정지<br></span>휴대폰: 아래쪽 좌우 버튼으로 움직이세요.</p>
  </section>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let W=canvas.width,H=canvas.height,score=0,lives=3,level=1,best=Number(localStorage.getItem('brickBest')||0),playing=false,paused=false,raf=0,last=0,keys={left:false,right:false};const paddle={x:280,y:705,w:160,h:18,speed:610};let ball={x:360,y:670,r:10,vx:250,vy:-340};let bricks=[];$('best').textContent=best;
const colors=['#ff668f','#ff9f43','#ffd166','#4dd6a3','#55a7ff','#8d78ff'];
function makeBricks(){bricks=[];let rows=Math.min(5+level,9),cols=9,gap=8,pad=28,top=70,w=(W-pad*2-gap*(cols-1))/cols,h=25;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:pad+c*(w+gap),y:top+r*(h+gap),w,h,on:true,color:colors[r%colors.length]})}
function resetBall(){paddle.x=(W-paddle.w)/2;ball={x:W/2,y:paddle.y-15,r:10,vx:(Math.random()>.5?1:-1)*(230+level*18),vy:-(335+level*18)}}
function updateStats(){$('score').textContent=score;$('lives').textContent=lives;$('level').textContent=level;if(score>best){best=score;localStorage.setItem('brickBest',best);$('best').textContent=best}}
function begin(){score=0;lives=3;level=1;makeBricks();resetBall();updateStats();playing=true;paused=false;$('overlay').classList.add('hide');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function stopLoop(){playing=false;cancelAnimationFrame(raf);raf=0}
function nextLevel(){level++;score+=500;makeBricks();resetBall();updateStats();stopLoop();$('message').textContent='단계 완료!';$('sub').innerHTML=level+'단계에 도전하세요.';$('start').textContent='계속하기';$('overlay').classList.remove('hide')}
function continueGame(){playing=true;paused=false;$('overlay').classList.add('hide');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function gameOver(){stopLoop();updateStats();$('message').textContent='게임 종료';$('sub').innerHTML='최종 점수 <b>'+score+'</b>점<br>다시 도전해 보세요!';$('start').textContent='다시 시작';$('overlay').classList.remove('hide')}
function pause(){if(!playing)return;paused=!paused;if(paused){$('message').textContent='일시정지';$('sub').textContent='준비되면 계속하세요.';$('start').textContent='계속하기';$('overlay').classList.remove('hide')}else continueGame()}
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c2038');g.addColorStop(1,'#030b15');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.shadowBlur=0;for(const b of bricks)if(b.on){roundRect(b.x,b.y,b.w,b.h,6,b.color);ctx.fillStyle='#ffffff55';ctx.fillRect(b.x+5,b.y+4,b.w-10,3)}roundRect(paddle.x,paddle.y,paddle.w,paddle.h,9,'#f4f8ff');ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#ffd166';ctx.fill()}
function hitRect(b){return ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h}
function update(dt){if(keys.left)paddle.x-=paddle.speed*dt;if(keys.right)paddle.x+=paddle.speed*dt;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&hitRect(paddle)){ball.y=paddle.y-ball.r;let pos=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=pos*(390+level*18);ball.vy=-Math.abs(ball.vy)}for(const b of bricks)if(b.on&&hitRect(b)){b.on=false;score+=10*level;let cx=ball.x-ball.vx*dt,cy=ball.y-ball.vy*dt;if(cx<b.x||cx>b.x+b.w)ball.vx*=-1;else ball.vy*=-1;updateStats();break}if(bricks.every(b=>!b.on)){nextLevel();return}if(ball.y-ball.r>H){lives--;updateStats();if(lives<=0)gameOver();else{resetBall();playing=false;$('message').textContent='한 번 놓쳤어요';$('sub').textContent='남은 목숨 '+lives+'개';$('start').textContent='계속하기';$('overlay').classList.remove('hide')}}}
function loop(t){if(!playing){cancelAnimationFrame(raf);raf=0;return}let dt=Math.min((t-last)/1000,.025);last=t;update(dt);draw();if(playing)raf=requestAnimationFrame(loop)}
$('start').onclick=()=>score===0&&lives===3&&level===1&&!bricks.length?begin():(lives<=0?begin():continueGame());document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){keys.left=true;e.preventDefault()}if(e.key==='ArrowRight'){keys.right=true;e.preventDefault()}if(e.code==='Space'){e.preventDefault();if(!bricks.length)begin();else pause()}});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
let dragging=false,pointerTick=0;function point(e){if(!playing||!dragging)return;let now=performance.now();if(now-pointerTick<20)return;pointerTick=now;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2))}canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){dragging=true;point(e)}});canvas.addEventListener('pointermove',point,{passive:true});window.addEventListener('pointerup',()=>dragging=false,{passive:true});function hold(id,dir){let el=$(id);el.onpointerdown=e=>{e.preventDefault();keys[dir]=true};['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>keys[dir]=false))}hold('left','left');hold('right','right');document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)pause()});window.addEventListener('wheel',()=>{if(playing)pause()},{passive:true});window.addEventListener('pagehide',stopLoop);makeBricks();draw();bricks=[];
</script>
</body>
</html>
